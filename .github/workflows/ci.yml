name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: issue
          POSTGRES_PASSWORD: issue
          POSTGRES_DB: issue_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U issue -d issue_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://issue:issue@localhost:5432/issue_tracker_test
      REDIS_URL: redis://localhost:6379/1
      BOOTSTRAP_TOKEN: test-bootstrap-token
      APP_ENV: test
      LOG_LEVEL: warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Docker image
        run: docker build -t issue-tracker-api:ci .
